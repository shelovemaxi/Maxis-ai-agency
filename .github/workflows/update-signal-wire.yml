name: Refresh Signal Wire data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: signal-wire-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r signal-wire/requirements.txt

      - name: Refresh Signal Wire data
        env:
          WORLDMONITOR_API_KEY: ${{ secrets.WORLDMONITOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python signal-wire/scripts/update_signal_wire.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json docs/data.json signal-wire/data.json signal-wire/docs/data.json
          git diff --cached --quiet || git commit -m "chore: refresh Signal Wire data"
          git push
