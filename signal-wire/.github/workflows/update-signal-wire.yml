name: Refresh Signal Wire data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: signal-wire-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-wire
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh public snapshot
        run: python scripts/update_signal_wire.py
      - name: Commit refreshed data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal-wire/docs/data.json
          git diff --cached --quiet || git commit -m "chore: refresh Signal Wire data"
          git push
